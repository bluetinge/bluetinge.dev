<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> -->
  <title>Shader Editor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: sans-serif;
    }

    #container {
      display: flex;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    
    canvas {
      flex: 1;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      min-width: 0;
      min-height: 0;
    }
    canvas:active {
      cursor: grabbing;
    }

    #ui {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 20%;
      max-width: 80%;
      background: #1a1a1a;
      border-right: 1px solid #333;
      overflow: hidden;
      flex: 0 0 40%; /* Start at 400px wide */
    }
    
    textarea {
      flex: 1;
      width: 100%;
      resize: none;
      font-family: monospace;
      font-size: 13px;
      background: #111;
      color: #eee;
      border: none;
      outline: none;
      padding: 0.5em;
      overflow-y: auto;
    }

    button {
      background: #333;
      color: white;
      border: none;
      padding: 0.5em 1em;
      border-top: 1px solid #444;
      cursor: pointer;
      font-family: monospace;
      font-weight: medium;
    }
    button:hover {
      font-weight: bold;
    }

    #log {
      font-size: 12px;
      color: #f66;
      background: #111;
      padding: 0.25em 0.5em;
      white-space: pre-wrap;
      border-top: 1px solid #222;
      max-height: 12em;
      overflow-y: auto;
    }
    
    .shader-tab {
      flex: 1;
      padding: 0.4em;
      background: #222;
      border: none;
      color: #ccc;
      font-family: monospace;
      cursor: pointer;
    }
    .shader-tab.active {
      background: #333;
      color: white;
      font-weight: bold;
    }
    
#uniform-panel {
    
      overflow: auto;
      min-height: 10%;
      max-height: 80%;
      display: block;
      whiteSpace: nowrap;
      background: #1b1b1b;
      border-top: 1px solid #333;
      overflow-y: auto;
      /*flex: 0 0 30%; /* Start at 30% tall */
    }
    
.variables-container {
  display: grid;
  grid-template-columns: auto auto 1fr;
  column-gap: 0.5em;
  row-gap: 0em;
  align-items: start;
  font-family: monospace;
  font-size: 14px;
  padding: 0.5em;
}
.variables-container.inactive{
  display:none;
}


.variable-wrapper {
  display: contents; /* Allow child elements to align directly in the grid */
  padding: 0.5em;
}

.variable-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 8em;
  padding: 0.15em;
}

.element-label {
  white-space: nowrap;
  overflow: hidden;
  grid-column: 1;
  padding-top: 0.2em;
}

/* If only one rowGroup, label in column 1, rowGroup in column 2 */
.single-row .variable-label {
  grid-column: 2;
}

/* For multi-row: label spans 2 columns, then contents span 2 below */
.multirow .variable-label {
  grid-column: 2 / span 3;
}

.single-row .variable-contents {
  grid-column: 3;
  display: contents;
  overflow-x: visible;
  white-space: nowrap;
}

.multirow .variable-contents {
  grid-column: 1 / span 3;
  display: contents;
  overflow: visible;
  /*grid-template-columns: repeat(auto-fit, minmax(4em, auto));*/
}

.single-row .row-group {
  grid-column: 3;
  display: block;
}

.single-row .variable-row { /*AKA rowGroup*/
  display: contents;
  overflow: visible;
  flex-wrap: nowrap;
  align-items: center;
  padding: 0.25em;
}

.multirow .variable-row { /*AKA rowGroup*/
  display: flex;
  overflow: visible;
  flex-wrap: nowrap;
  grid-column: 2 / span 3;
}

.vertex-count .variable-row { 
  display: flex;
  grid-column: 2 / span 3;
  align-items: center;
  padding: 0.25em;
}

.vertex-count .variable-label {
  display: block;
  grid-column: 2;
}

.vertex-count input {
  display: block;
  grid-column: 3;
}

.group-end.variable-row { /* End of a row group*/
  padding-bottom: 0.5em;
}


.row-group { /*group of rows*/
  display: contents;
}
    
    .variable-input {
      margin: 0.1em;
      display: inline;
      overflow: visible;
    }
    
    input[type="number"] {
      width: 4em;
    }
    
    input[type="checkbox"] {
      width: 2em;
    }
    
    input:disabled {
      background: #222;
    }
    
    .collapse-arrow {
      grid-column: 1;
      font-family: sans-serif;
      font-size: 14px;
      cursor: pointer;
      margin-right: 0.25em;
      margin-left: 0.25em;
      user-select: none;
        padding: 0.15em;
    }
    
    .single-row .collapse-arrow {
      visibility: hidden;
      grid-column: 1;
    }
    .multirow .collapse-arrow {
      grid-column: 1;
    }
    
    .collapsed .variable-contents {
      display:none;
    }

    .divider {
      background: #444;
      z-index: 5;
      touch-action: none;
    }
    .divider:hover {
      background: #666;
    }
    
    .col-divider {
      min-width: 5px;
      width: 5px;
      cursor: col-resize;
    }
    
    .row-divider {
      min-height: 5px;
      height: 5px;
      cursor: row-resize;
    }
    
@media (pointer: coarse) {

    .col-divider {
      min-width: 14px;
      width: 14px;
      cursor: col-resize;
    }
    
    .row-divider {
      min-height: 14px;
      height: 14px;
      cursor: row-resize;
    }

}
    
    .hide { display: None; }
    .draw-mode {padding: 0.5em; visibility: hidden;}

#canvas-container {
  position: relative;
  flex: 1;
  overflow: hidden;
  touch-action: pan-x pan-y;
}

#storage-controls {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 1000;
  width: fit-content;
  min-width: 20%;
  max-width: 420px
  background: rgba(20, 20, 20, 0.5);
  border: 1px solid #333;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  padding: 8px;
}
#storage-controls.editing {
  width: var(--locked-width);
}

.filename-row{
  display:flex;
  flex: 1;
  min-width: 0;
  max-width: 100%;
  align-items:center;
  gap:0.5em;
  margin-bottom:0.5em;
  font-size:12px;
}

.filename-label{
  white-space:nowrap;
  opacity:0.9;
}

.filename-display{
  flex:1;
  min-width:0;
  font-family: monospace; 
  padding:0.25em 0.4em;
  border-radius:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  cursor:text;
  font-size:12px;
}

.filename-input{
  font-size:12px;
  flex: 1;
  min-width: 0;
  max-width: 100%;
  font-family: monospace;
  background:#111;
  color:#eee;
  border:1px solid #666;
  padding:0.25em 0.4em;
  border-radius:4px;
  outline:none;
  display:none; /* start hidden */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;
}

/* The Modal (background) */
.modal-background {
  display: none; /* Hidden by default */
  position: fixed; /* Stay in place */
  z-index: 2047; /* Sit on top */
  /*padding-top: 100px; /* Location of the box */
  align-items: center;      /* Centers vertically */
  justify-content: center;  /* Centers horizontally */
  left: 0;
  top: 0;
  width: 100%; /* Full width */
  height: 100%; /* Full height */
  /*overflow: auto; /* Enable scroll if needed */
  background-color: rgb(0,0,0); /* Fallback color */
  background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
  font-family: monospace;/*Arial, Helvetica, sans-serif;*/
}

.modal-content {
  background-color: #1b1b1b;
  border: 1px solid #333;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  margin: auto;
  padding: 20px;
  width: 50%;
  align-items: center;
}

.modal-close {
  z-index: 2048;
  /*
  position:absolute;
  top: 20%;
  right: 20%;
  */
  float: right;
  font-size: 84px;
  font-weight: bold;
  color: white;
  margin-top: -20px;
  margin-right: -10px;
  padding: 0px;
  width: 60px;
  height: 60px;
  line-height: 60px;
  text-align: center;
  vertical-align: middle;
  overflow:hidden;
  /*
  background-color: #fefefe;
  border: 4px solid #888;
  border-radius: 20px;
  float: right;
  */
}

.modal-close:hover,
.rssr-modal-close:focus {
  color: red;
  text-decoration: none;
  cursor: pointer;
}

.texture-preview {
  justify-self:center;
  text-align: center;
  padding: 20px;
  padding-top:0px;
}

  </style>
</head>

" width="256" height="256" style="justify:center;">
        <p id="texture-p">Filename</p>
      </div>
      <div style="display:flex; gap:0.5em;">
        <button id="upload-texture" style="flex:1;">Upload texture</button>
        <button id="fetch-texture" style="flex:1;">Fetch from url</button>
      </div>
      <input type="file" id="file-input-texture" accept="image/*" style="display:none" />
    </div>
  </div>
</div>

let rendering = false; // if true: currently requesting next animation frame. if false: not doing that due to an error (or it hasnt started yet or something)

else document.getElementById("uniform-panel").style.flexBasis = `${Math.round(window.innerHeight * 0.4)}px`; // about 278..?

}

        unlockLevel = 2;
        //document.getElementById("tab-uniforms").style.display = "";

      }

  };
  shad.addEventListener("input", func);

const DEFAULT_TEXTURE = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAAAAACH5BAAAAAAALAAAAAABAAEAAAICTAEAOw==";

  ]}
}

const SYS_UNIFORMS = {
  SYS_RAND:      { type: gl.FLOAT,   size: 1, update:(info)=>{
    let value = SYS_UNIFORMS["SYS_RAND"]["value"];
    if(!value) return;
    value[0] = Math.random();
    uniformValues["SYS_RAND"] = value;
  }, display: (v)=>{return v;}
  },
  SYS_TIME:      { type: gl.FLOAT,   size: 1, update:(info)=>{
    let value = SYS_UNIFORMS["SYS_TIME"]["value"];
    if(!value) return;
    value[0] = info["T"];
    uniformValues["SYS_TIME"] = value;
  }, display: (v)=>{return Math.round(100*v)/100;}
  },
  SYS_DELTATIME:      { type: gl.FLOAT,   size: 1, update:(info)=>{
    let value = SYS_UNIFORMS["SYS_DELTATIME"]["value"];
    if(!value) return;
    value[0] = info["DT"];
    console.log(value[0]);
    uniformValues["SYS_DELTATIME"] = value;
  }, display: (v)=>{return Math.round(10000*v)/10000;}
  },
  SYS_RESOLUTION:{ type: gl.FLOAT_VEC2,    size: 2, update: (info)=>{
    let value = SYS_UNIFORMS["SYS_RESOLUTION"]["value"];
    if (!value) return;
    value[0] = gl.canvas.width;
    value[1] = gl.canvas.height;
    //value[2] = gl.canvas.height / gl.canvas.width;
    uniformValues["SYS_RESOLUTION"] = value;
  }},
  SYS_MOUSE:     { type: gl.FLOAT_VEC4, size: 4, update: (info)=>{
    let value = SYS_UNIFORMS["SYS_MOUSE"]["value"];
    if(!value) return;
    value[0] = mouseHoverUniformX / gl.canvas.width;
    value[1] = mouseHoverUniformY / gl.canvas.height;
    value[2] = mouseClickUniformX / gl.canvas.width;
    value[3] = mouseClickUniformY / gl.canvas.height;
    uniformValues["SYS_MOUSE"] = value;
  }},
  SYS_MVP:     { type: gl.FLOAT_MAT4, size: 16, update: (info)=>{
    let value = SYS_UNIFORMS["SYS_MVP"]["value"];
    if(!value) return;
    SYS_UNIFORMS["SYS_MVP"].value = info.MVP;
    uniformValues["SYS_MVP"] = info.MVP;
  }},
  SYS_M:     { type: gl.FLOAT_MAT4, size: 16, update: (info)=>{
    let value = SYS_UNIFORMS["SYS_M"]["value"];
    if(!value) return;
    SYS_UNIFORMS["SYS_M"].value = info.M;
    uniformValues["SYS_M"] = info.M;
  }},
  SYS_V:     { type: gl.FLOAT_MAT4, size: 16, update: (info)=>{
    let value = SYS_UNIFORMS["SYS_V"]["value"];
    if(!value) return;
    SYS_UNIFORMS["SYS_V"].value = info.V;
    uniformValues["SYS_V"] = info.V;
  }},

// Manipulate camera: mouse or pointer

let draggingMouse = false, middleMouseHeld = false, rightMouseHeld = false;
let lastMouseX = 0, lastMouseY = 0;
let mouseHoverUniformX = 0, mouseHoverUniformY = 0, mouseClickUniformX = 0, mouseClickUniformY = 0;

const pointers = new Map(); // pointerId -> {x,y,type}
let pinchStartDist = 0;
let pinchStartRadius = 0;
let lastTouchMidX = 0, lastTouchMidY = 0;

function clampPitch(pitch_) {
  return Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch_));
}
function canControlCamera() {
  return !resizingCol && !resizingUniforms;
}

canvas.addEventListener("pointerdown", (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
  console.log(e.button);
  // Mouse: behave like your old mousedown
  if (e.pointerType === "mouse") {
    if (!canControlCamera()) return;
    draggingMouse = true;
    if (e.button == 1) middleMouseHeld = true;
    if (e.button == 2) rightMouseHeld = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  } else {
    // Touch/pen: capture so we keep getting moves even if finger drifts
    canvas.setPointerCapture(e.pointerId);
    // DO NOT preventDefault here — allow 1-finger scroll
  }
});

canvas.addEventListener("pointermove", (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) {
    const rect = canvas.getBoundingClientRect();
    mouseHoverUniformX = e.clientX - rect.left;
    mouseHoverUniformY = gl.canvas.height - (e.clientY - rect.top); // flip Y
    return;
  }
  else {
    const rect = canvas.getBoundingClientRect();
    mouseClickUniformX = e.clientX - rect.left;
    mouseClickUniformY = gl.canvas.height - (e.clientY - rect.top); // flip Y
  }
  
  const prevX = p.x, prevY = p.y;
  p.x = e.clientX; p.y = e.clientY;

  if (!canControlCamera()) return;

  // Mouse drag orbit (same feel as before)
  if (e.pointerType === "mouse") {
    if (!draggingMouse) return;
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    if(e.shiftKey) { //on shift: rotate model
      if(rightMouseHeld){// shift+right: yaw
         modelYaw += dx * 0.005;
      }
      else { // shift+left: move pitch
        modelPitch += dy * 0.005;
        modelPitch = clampPitch(modelPitch);
      }
    }
    else if(e.ctrlKey) { //on ctrl: move light source
        lightYaw -= dx * 0.005;
        lightPitch += dy * 0.005;
        lightPitch = clampPitch(lightPitch);
    }
    else { 
      // if right click: move SYS_M instead
      if(rightMouseHeld) {
        modelX = Math.min(Math.max(modelX + dx * 0.01, -modelMax),modelMax);
        modelZ = Math.min(Math.max(modelZ + dy * 0.01, -modelMax),modelMax);
      }
      else{ // left click: rotate camera
        camYaw -= dx * 0.005;
        camPitch += dy * 0.005;
        camPitch = clampPitch(camPitch);
      }
    }
    e.preventDefault();
    return;
  }

  // Touch: only hijack if >=2 touches on canvas
  const touches = [...pointers.values()].filter(v => v.type !== "mouse");
  if (touches.length < 2) {
    // 1-finger: do nothing so the page can scroll naturally
    pinchStartDist = 0;
    return;
  }

  // 2-finger: pinch zoom (and optionally orbit with midpoint drag)
  e.preventDefault(); // IMPORTANT: stop page zoom/scroll during 2-finger gesture

  const [a, b] = touches;
  const midX = (a.x + b.x) * 0.5;
  const midY = (a.y + b.y) * 0.5;

  const dist = Math.hypot(a.x - b.x, a.y - b.y);

  if (!pinchStartDist) {
    pinchStartDist = dist;
    pinchStartRadius = camRadius;
    lastTouchMidX = midX;
    lastTouchMidY = midY;
    return;
  }

  // Pinch -> zoom (radius)
  const scale = pinchStartDist / Math.max(dist, 1);
  camRadius = Math.max(0.5, Math.min(10, pinchStartRadius * scale));

  // Optional: two-finger midpoint drag -> orbit
  const mdx = midX - lastTouchMidX;
  const mdy = midY - lastTouchMidY;
  lastTouchMidX = midX;
  lastTouchMidY = midY;

  camYaw -= mdx * 0.005;
  camPitch += mdy * 0.005;
  camPitch = clampPitch(camPitch);
}, { passive: false }); // allow preventDefault

canvas.addEventListener("pointerup", (e) => {
  pointers.delete(e.pointerId);

  if (e.pointerType === "mouse") {
    draggingMouse = false;
    middleMouseHeld = false;
    rightMouseHeld = false;
  }

  // reset pinch state if fewer than 2 touches remain
  const touches = [...pointers.values()].filter(v => v.type !== "mouse");
  if (touches.length < 2) pinchStartDist = 0;

  try { canvas.releasePointerCapture(e.pointerId); } catch {}
});

canvas.addEventListener("pointercancel", (e) => {
  pointers.delete(e.pointerId);
  draggingMouse = false;
  pinchStartDist = 0;
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
});

  }
  else {
    camRadius *= Math.exp(e.deltaY * -0.001 * 0.5);
    camRadius = Math.max(0.5, Math.min(10, camRadius));
  }
}, { passive: false });

// error callback for twgl
function logError(msg, line) {
  console.warn(msg);
  const lines = msg.split("\n");
  var logMsg = ""; var logall = false;
  for (let i = 0; i < lines.length; i++) {
    if(lines[i] == "\0") continue;
    if(lines[i].startsWith("^^^")) logMsg += `${lines[i-2]}\n${lines[i]}\n`;
    if(lines[i].startsWith("Error compiling")) logall = true;
    if(logall) logMsg += `${lines[i]}\n`;
  }
  console.log(logMsg);
  if (logMsg.length == 0) logMsg = msg;
  document.getElementById("log").textContent = logMsg;
  document.getElementById("log").style.color = "red";
}

// potentially relevant: WEBGL_clip_cull_distance, EXT_conservative_depth, NV_shader_noperspective_interpolation, OES_sample_variables, OES_shader_multisample_interpolation, OVR_multiview2, WEBGL_multi_draw, WEBGL_blend_func_extended
function enableExtensions(glslSource) {
  // 1. Strip comments
  const noComments = glslSource
    .replace(/\/\*[\s\S]*?\*\//g, '')     // block comments
    .replace(/\/\/.*$/gm, '');    // line comments

  // 2. Match #extension directives
  const regex = /^\s*#\s*extension\s+([A-Za-z0-9_]+)\s*:/gm;
  let match;
  while ((match = regex.exec(noComments)) !== null) {
    const ext_name = match[1].startsWith("GL_") ? match[1].slice(3) : match[1];
    //3. Try to enable it
    console.log("Attempting to enable "+ext_name+": result is "+gl.getExtension(ext_name));
  }
}

function createProgramFromSources(vertSrc, fragSrc) {
  try {
    enableExtensions(vertSrc);
    enableExtensions(fragSrc);
    const newProgramInfo = twgl.createProgramInfo(gl, [vertSrc, fragSrc], logError);
    if(!newProgramInfo) return; //should already be logged due to logError
    currentProgramInfo = newProgramInfo;
    extractVariables(currentProgramInfo.program);
    buildAttributeBuffers();
    console.log(uniformValues);
    
    if(teachingMode) {
      if(Object.keys(uniformValues) == 0 && unlockLevel == 0) {
        document.getElementById("uniform-panel").style.display = "None";
      }
      else {
        document.getElementById("uniform-panel").style.display = "";
        if (unlockLevel < 1) {
          unlockLevel = 1;
          localStorage.setItem("unlockLevel", unlockLevel);
        }
      }
    }
    
    document.getElementById("log").textContent = "Shader compiled successfully.";
    document.getElementById("log").style.color = "white";
    localStorage.setItem("frag_shader_code", fragSrc); // save on success
    localStorage.setItem("vert_shader_code", vertSrc); // save on success
    
    // reset time counter
    timeStart = undefined;
    
    // continue rendering if it stopped previously due to an error
    if(!rendering) {
      rendering = true;
      requestAnimationFrame(render);
    }
  } catch (err) {
    console.error(err);
    document.getElementById("log").textContent = err.message;
    document.getElementById("log").style.color = "red";
  }
}

function extractVariables(program) {
  uniformValues = {}; // reset
  attributeValues = {}; // reset
  
  // setting up system uniforms
  for (const [_,sys] of Object.entries(SYS_UNIFORMS)) { sys["input"] = undefined; sys["value"] = undefined;}
  // Not currently SYS_ATTRIBUTES but they would go here

  // Extract uniforms and attributes from program
  const numUniforms = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  const numAttributes = gl.getProgramParameter(program, gl.ACTIVE_ATTRIBUTES);

  const uniformInfo = [];
  for (let i = 0; i < numUniforms; i++) {
    const info = gl.getActiveUniform(program, i);
    if(info && info.name) uniformInfo.push(info); 
    else console.warn(`Malformed uniform ${i} extracted: `, info);
  }
  const attributeInfo = [{name:"vertex count",type:gl.UNSIGNED_INT_VEC3, size:1}];
  for (let i = 0; i < numAttributes; i++) {
    const info = gl.getActiveAttrib(program, i);
    //if(info && info.name) info.location = gl.getAttribLocation(program, info.name);
    if(info && info.name && info.size == 1/*&& info.location*/) attributeInfo.push(info);
    else console.warn(`Malformed attribute ${i} extracted: `, info);
  }

  // load saved values
  const saved_variables = JSON.parse(localStorage.getItem("shader_variables") || "{}");
  if(!saved_variables.uniforms) saved_variables.uniforms = {};
  if(!saved_variables.attributes) saved_variables.attributes = {};
  
  uniformsDiv.innerHTML = ''; // clear UI
  attributesDiv.innerHTML = ''; // clear UI
  
  buildVariableEditor("uniform", saved_variables, saved_variables.uniforms, uniformInfo, uniformValues, uniformsDiv);
  buildVariableEditor("attribute", saved_variables, saved_variables.attributes, attributeInfo, attributeValues, attributesDiv);
}

function buildVariableEditor(variableType,allSavedVariables,saved,extractedInfo,variableValues, editorDiv) {
  
  // validate loaded things
  for (const [name,obj] of Object.entries(saved)) {
    if (!( // qualities of valid variables:
      obj && obj.arrays && obj.shape &&
      obj.arrays.length == obj.shape[0] &&
      obj.arrays.flat().length == obj.shape[0] * obj.shape[1] &&
      obj.arrays.flat().flat().length == obj.shape[0] * obj.shape[1] * obj.shape[2]
    )) {
      console.warn(`Saved ${variableType} ${name} failed validation: `,obj);
      delete saved[name];
    }
  }
  
  
  if(variableType == "attribute")
  for (const i in extractedInfo) {
    const aName = extractedInfo[i].name;
    if(aName == "vertex count") saved["Triangles:"] = getTriangles(drawMode);  
    if (!saved[aName]) { // if the attribute is not already saved
      for (const def_name in DEFAULT_ATTRIBUTES) {
        console.log(aName,def_name);
        if(aName.toUpperCase().search(def_name) != -1) { // and it matches a default
          saved[aName] = DEFAULT_ATTRIBUTES[def_name]; //use the default thing
        }
      }
    }
    
  }

  let sysUniforms = [];

  for (let i = 0; i < extractedInfo.length; i++) {
    const info = extractedInfo[i];
    //console.log(info.type,info.size);

    let variableName = info.name.replace(/\[0\]$/, "");

    const isSys = variableName in SYS_UNIFORMS;
    const isVertexCount = (variableName == "vertex count");
    if(isVertexCount) {
      buildVertexCountEditor(allSavedVariables,saved,extractedInfo,variableValues, editorDiv);
      //if triangle strip: continue      
      variableName = "Triangles:";
    }
    if(isSys && info.type != SYS_UNIFORMS[variableName]["type"]) {
      throw new Error(`System ${variableType} ${variableName} must be of type ${uniformTypeMap[SYS_UNIFORMS[variableName]["type"]]["label"]}`);
    }
    const typeInfo = uniformTypeMap[info.type];
    if (!typeInfo) continue; // skip unsupported types for now
    
    // shape: always length 3. [arrayElemCount, rowCountPerGroup, colCount]
    // note: gl.FLOAT_MAT2x3 means two vec3s, which in our representation are rows. So: 2 rows of 3 columns
    const shape = [variableType == "attribute" ? (isVertexCount ? triangles.length : vertexCount) : info.size, typeInfo.shape[0], typeInfo.shape[1]]
    const arrayElemCount = shape[0];
    let rowGroupCount = shape[0];
    let rowCountPerGroup = shape[1]; // i.e., rows per row group
    let colCount = shape[2]; // col count is TOTAL number of columns to RENDER
    let rowCount = rowGroupCount * rowCountPerGroup; // row count is TOTAL number of rows to RENDER (across rows and row groups)
    if (colCount == 1 && rowCountPerGroup == 1 && rowCount > 1 && !typeInfo.wide){
      if (rowCount <= 4) { // compress multiple rows into one if less than 4 total
        colCount = rowCount;
        rowCount = 1;
      }
      else{ // try some other arrangements
        const toTry = rowCount >= 30 ? [Math.floor(Math.sqrt(rowCount)), 10, 8, 5, 4, 9, 7, 6, 3, 2] : (rowCount >= 14 ? [5, 4, 6, 3, 2] : [5, 4, 3]);
        for (const newColCount of toTry) {
          if (newColCount < rowCount && rowCount % newColCount == 0) {
            colCount = newColCount;
            rowCount = rowCount / newColCount;
            rowGroupCount = rowCount;
            break;
          }
        }
      }
    }
    const valueCount = rowCount * colCount;

    const defaultVal = typeInfo.defaultVal === undefined ? 1 : typeInfo.defaultVal;  
    const nestedVal = Array.from({length: shape[0]}, e => Array.from({length: shape[1]}, f => Array(shape[2]).fill(defaultVal))); //unflattened
    // nestedVal is only as big as it needs to be, savedVal holds ALL saved values
    if(variableName in saved) {  
      let savedVal = saved[variableName].arrays, savedShape = saved[variableName].shape;
      let maxShape = [Math.max(shape[0],savedShape[0]), Math.max(shape[1],savedShape[1]), Math.max(shape[2],savedShape[2])];
      for (let elem = 0; elem < maxShape[0]; elem++) {
        if(!savedVal[elem]) savedVal[elem] = Array(maxShape[1]); //extend
        for(let rg = 0; rg < maxShape[1]; rg++) {
          if(!savedVal[elem][rg]) savedVal[elem][rg] = Array(maxShape[2]).fill(defaultVal); // extend
          if(savedVal[elem][rg].length < maxShape[2]) { 
            savedVal[elem][rg].length = maxShape[2]; //extend
            savedVal[elem][rg].fill(defaultVal, savedShape[2], maxShape[2]) //fill new values
          }
          for(let c = 0; elem < shape[0] && rg < shape[1] && c < shape[2]; c++) nestedVal[elem][rg][c] = savedVal[elem][rg][c];  //copy saved values
        }
      }
      saved[variableName].shape = maxShape;
    }
    else saved[variableName] = {"arrays":nestedVal, "shape":shape};
    saved[variableName].name = info.name;
    saved[variableName].size = info.size;
    
    //saved[variableName].rowCount = rowCount;
    //saved[variableName].colCount = colCount;
    saved[variableName].type = info.type;
    saved[variableName].isSys = isSys;

    // load values into variableValues array for TWGL: either with custom loader or directly with the flattened nestedVal array
    if(typeInfo.load) {
      const flatVals = nestedVal.flat().flat();
      variableValues[variableName] = Array(arrayElemCount);
      for (const j in flatVals) {
        const ret = typeInfo.load(saved[variableName], flatVals[j], j);
        if(ret) {
          if(arrayElemCount > 1) variableValues[variableName][j] = ret;
          else variableValues[variableName] = ret;
        }
      }
    }
    else {
      variableValues[variableName] = nestedVal.flat().flat();
      if(typeInfo.array) variableValues[variableName].type = typeInfo.array;
    }

    // Create UI
    const wrapper = document.createElement("div");
    wrapper.classList.add("variable-wrapper");
    if (isVertexCount) wrapper.id = ("indexWrapper");
    if (isVertexCount && drawMode != "index") wrapper.classList.add("hide");
    if (rowCount == 1) wrapper.classList.add("single-row");
    else wrapper.classList.add("multirow");
    if(isSys) wrapper.classList.add("system-variable");
    
    const label = document.createElement("label");
    label.classList.add("variable-label");
    label.textContent = `${typeInfo.label}${arrayElemCount> 1 ? `[${arrayElemCount}]`:""} ${variableName}`;
    //if(isVertexCount) label.textContent = "triangle indices:";
    wrapper.appendChild(label);

    const allRows = document.createElement("div");
    allRows.classList.add("variable-contents");
    
    let rowGroup = document.createElement("div");
    rowGroup.classList.add("row-group");
    
    const arrow = document.createElement("span");
    arrow.classList.add("collapse-arrow");
    arrow.textContent = "▼";
    if (rowCount > 1) {
      const isCollapsed = !!saved[variableName].collapsed;
      if(isCollapsed) {
        arrow.textContent = "▶";
        wrapper.classList.add("collapsed");
      }
      arrow.addEventListener("click", () => {
        wrapper.classList.toggle("collapsed");
        arrow.textContent = wrapper.classList.contains("collapsed") ? " ▶ " : " ▼ ";
        saved[variableName].collapsed = wrapper.classList.contains("collapsed");
        localStorage.setItem("shader_variables", JSON.stringify(allSavedVariables)); //TODO ****
      });
    }
    wrapper.prepend(arrow);
    
    let currentRow = document.createElement("div");
    currentRow.classList.add("variable-row");

    const value = variableValues[variableName];
    if(isSys){
      SYS_UNIFORMS[variableName]["value"] = value; ///TODO ***
      SYS_UNIFORMS[variableName]["input"] = [] ///TODO ***
    }
     
    for (let j = 0; j < valueCount; j++) {
      let c = j % colCount;                                         // c iterates through units in columns
      let rg = Math.floor( j / colCount) % rowCountPerGroup;                // rg iterates through rows in row groups
      let elem = Math.floor(j / (colCount * rowCountPerGroup)) % rowGroupCount;  // elem iterates through row groups in wrapper
      
      let cVal = j % shape[2];                                         // c iterates through units in columns
      let rgVal = Math.floor( j / shape[2]) % shape[1];                // rg iterates through rows in row groups
      let elemVal = Math.floor(j / (shape[2] * shape[1])) % shape[0];  // elem iterates through row groups in wrapper
      
      console.log(elem,rg,c,j)
      
      // Check if we are ending a row group 
      if(c==colCount - 1 && rg == rowCountPerGroup - 1) {
        currentRow.classList.add("group-end");
        console.log("Final row of RG");
      }
      
      // Check if we are starting a new row
      if(j != 0 && c==0 ){ 
        rowGroup.appendChild(currentRow); // append old row
        currentRow = document.createElement("div"); //start new row
        currentRow.classList.add("variable-row");
         // Check if we are starting a new row group
         if(rg == 0 && rowCount > 1) {
          allRows.appendChild(rowGroup); // append old row group
          rowGroup = document.createElement("div"); //start new one
          rowGroup.classList.add("row-group"); 
         }
      }

      // TODO: make a thing called variable-group, which is across all 3 columns, and has both the element label and the rows inside it. 
     if(c == 0 && rg == 0 && arrayElemCount > 1 && rowCount > 1) {
        const elemLabel = document.createElement("label");
        elemLabel.classList.add("element-label");
        elemLabel.textContent = `[${elemVal}]`;
        rowGroup.append(elemLabel);
      }
      
      const input = document.createElement("input");
      input.classList.add("variable-input");
      input.type = typeInfo.type;
      input.step = typeInfo.step;
      if(typeInfo.min) input.min = typeInfo.min;
      if(typeInfo.max) input.max = typeInfo.max;
      if(isVertexCount) input.max = vertexCount-1;
      if(input.type == "checkbox") input.checked = !!(value[j]);
      if(typeInfo.setup) typeInfo.setup(input, saved[variableName].arrays[elemVal][rgVal][cVal], variableName, label.textContent); 
      else input.value = value[j];

      if(isSys){
        input.disabled = true;
        input.title = `Built-in system ${variableType} (read-only)`;
        SYS_UNIFORMS[variableName]["input"][j] = input; ///TODO ***
      }
      else {
        input.addEventListener("input", () => { //TODO: blur + enter to submit for image laoding
          const parsed = typeInfo.parser(input);
          if(typeInfo.load) { //FINDME_SAVE
            const ret = typeInfo.load(saved[variableName], parsed, j);
            if(ret) {
              if (variableValues[variableName].length) variableValues[variableName][j] = ret;
              else variableValues[variableName] = ret;
              localStorage.setItem("shader_variables", JSON.stringify(allSavedVariables));
            }
          }
          else if (!isNaN(parsed)) {
            value[j] = parsed;
            variableValues[variableName] = value;
            saved[variableName].arrays[elemVal][rgVal][cVal] = parsed;
            if(variableType == "attribute") buildAttributeBuffers();
            localStorage.setItem("shader_variables", JSON.stringify(allSavedVariables));
          }
        });
      }
      
      currentRow.appendChild(input);
    }
    rowGroup.appendChild(currentRow);
    console.log("Final RG appended");
    allRows.appendChild(rowGroup);
    wrapper.appendChild(allRows);
    if(isSys) sysUniforms.push(wrapper); ///TODO ***
    else editorDiv.appendChild(wrapper); 
  }
  for (let i in sysUniforms) { editorDiv.appendChild(sysUniforms[i]); } ///TODO ***
}

function buildAttributeBuffers() {
  const arrays = {};
  for (const [name, attr] of Object.entries(attributeValues)) {
    arrays[name] = {
      numComponents: attr.length / vertexCount,
      data: attr,
      type: attr.type
    };
  }
  bufferInfo = twgl.createBufferInfoFromArrays(gl, arrays);
}

function render(time) {
  try {
    time *= 0.001;
    const dt = time - lastTime;
    lastTime = time;
    if(timeStart === undefined) timeStart = time;
    //console.log(dt);

    updateKeyboard(dt);
    twgl.resizeCanvasToDisplaySize(gl.canvas);
    
    const w = gl.drawingBufferWidth;
    const h = gl.drawingBufferHeight;
    
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);

    const eye = [
      camRadius * Math.cos(camPitch) * Math.sin(camYaw),
      camRadius * Math.sin(camPitch),
      camRadius * Math.cos(camPitch) * Math.cos(camYaw)
    ];
    const target = [0, 0, 0];
    const up = [0, 1, 0];
    const cam = twgl.m4.lookAt(eye, target, up);
    
    const lighteye = [
      lightRadius * Math.cos(lightPitch) * Math.sin(lightYaw),
      lightRadius * Math.sin(lightPitch),
      lightRadius * Math.cos(lightPitch) * Math.cos(lightYaw)
    ];
    const light = twgl.m4.lookAt(lighteye, target, up);

    const model = twgl.m4.translate(twgl.m4.rotateX(twgl.m4.rotationY(modelYaw), modelPitch), [modelX, 0.0, modelZ]); //twgl.m4.identity();
    const view = twgl.m4.inverse(cam);
    const proj = twgl.m4.perspective(Math.PI / 4, w / h, 0.1, 100);
    const vp = twgl.m4.multiply(proj, view);
    const mvp = twgl.m4.multiply(vp, model);

    // Uniforms
    for (const [_,sys] of Object.entries(SYS_UNIFORMS)) { sys["update"]({"T":time - timeStart, "DT":dt, "MVP":mvp, "M": model, "V": view, "P": proj, "C": cam, "L": light}); }
    Object.assign(uniforms, uniformValues); // add uniforms

    gl.useProgram(currentProgramInfo.program);
    twgl.setBuffersAndAttributes(gl, currentProgramInfo, bufferInfo);
    twgl.setUniforms(currentProgramInfo, uniforms);
    twgl.drawBufferInfo(gl, bufferInfo,gl.TRIANGLE_STRIP)

    // once, after program creation
    
    // FOR TESTING:

    const strip4 = twgl.createBufferInfoFromArrays(gl, {
      a_dummy: { numComponents: 1, data: [0, 1, 2, 3] }, // any small attrib; not used
    });

    // when drawing
    twgl.setBuffersAndAttributes(gl, currentProgramInfo, strip4);
    twgl.setUniforms(currentProgramInfo, uniforms);
    // draw 4 verts as TRIANGLE_STRIP (force mode + count)
    twgl.drawBufferInfo(gl, strip4, gl.TRIANGLE_STRIP, 4);

    */ 
    
    
    /*
    //*Testing instances*
    // Example: 3 segments 
    // Draw: one strip of 4 verts per instance; no attributes, no indices.
    const instanceCount = 3;
    // TWGL needs a bufferInfo with numElements for non-indexed draws.
    const bufferInfo = { numElements: 4 };
    gl.depthFunc(gl.LESS);
    twgl.drawBufferInfo(gl, bufferInfo, gl.TRIANGLE_STRIP, 4, 0, instanceCount); //*testing instances
    */
    //
    
    requestAnimationFrame(render);
    rendering = true;
    for (const [_,sys] of Object.entries(SYS_UNIFORMS)) {
      
      if(sys.value && sys.input) { for (const i in sys["input"]) {
        if(sys.display) sys["input"][i].value = sys.display(sys.value[i]); 
        else sys["input"][i].value = Math.round(1000*sys.value[i])/1000; 
        }
      }
    }
  } catch (err) {
    console.error(err);
    rendering = false;
    document.getElementById("log").textContent = err.message;
    document.getElementById("log").style.color = "red";
    
  }
}

// HELPERS / FILENAME LABEL

const WORKSPACE_FILENAME_KEY = "workspace_filename";

function sanitizeFilename(name) {
  let s = (name || "").trim();

  // remove path separators and characters that cause trouble on Windows/macOS
  s = s.replace(/[\\\/:*?"<>|]/g, "_");

  // don’t allow empty
  if (!s) s = "Untitled-Shader.json";

  // ensure .json extension
  if (!s.toLowerCase().endsWith(".json")) s += ".json";

  return s;
}

function getWorkspaceFilename() {
  return localStorage.getItem(WORKSPACE_FILENAME_KEY) || "Untitled-Shader.json";
}

function setWorkspaceFilename(name) {
  const cleaned = sanitizeFilename(name);
  localStorage.setItem(WORKSPACE_FILENAME_KEY, cleaned);
  return cleaned;
}

function initWorkspaceFilenameUI() {
  const input = document.getElementById("workspace-filename");
  if (!input) return;

  // populate from storage
  input.value = getWorkspaceFilename();

  // update as user types (live)
  input.addEventListener("input", () => {
    // store a lightly-sanitized version, but don’t fight the user too hard while typing
    localStorage.setItem(WORKSPACE_FILENAME_KEY, input.value.trim());
  });

  // on blur / enter, fully sanitize + normalize extension
  const commit = () => {
    const cleaned = setWorkspaceFilename(input.value);
    input.value = cleaned;
  };

  input.addEventListener("blur", commit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      commit();
      input.blur();
    }
  });
}

initWorkspaceFilenameUI();

function initFilenameInlineEdit() {
  const display = document.getElementById("workspace-filename-display");
  const input = document.getElementById("workspace-filename-input");
  if (!display || !input) return;

  function refresh() {
    const name = getWorkspaceFilename();
    display.textContent = name;
    input.value = name;
  }

  function startEdit() {
    const panel = document.getElementById("storage-controls");

    // lock current width so swapping span->input doesn't change layout
    const w = panel.getBoundingClientRect().width;
    panel.style.setProperty("--locked-width", `${w}px`);
    panel.classList.add("editing");

    input.style.display = "block";
    display.style.display = "none";
    input.value = getWorkspaceFilename();
    input.focus();
    input.select();
  }

  function unlockPanelWidth() {
    const panel = document.getElementById("storage-controls");
    panel.classList.remove("editing");
    panel.style.removeProperty("--locked-width");
  }

  function commitEdit() {
    const cleaned = setWorkspaceFilename(input.value);
    display.textContent = cleaned;
    input.value = cleaned;

    input.style.display = "none";
    display.style.display = "block";
    unlockPanelWidth();
  }

  function cancelEdit() {
    input.style.display = "none";
    display.style.display = "block";
    refresh();
    unlockPanelWidth();
  }

  // Click display -> edit
  display.addEventListener("click", startEdit);

  // Commit on blur
  input.addEventListener("blur", commitEdit);

  // Commit on Enter, cancel on Escape
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      input.blur(); // triggers commitEdit
    } else if (e.key === "Escape") {
      e.preventDefault();
      cancelEdit();
    }
  });

  // Keep it up to date on load
  refresh();

  // Optional: expose a way to refresh after save/load changes the name
  window.refreshWorkspaceFilenameUI = refresh;
}

initFilenameInlineEdit();

  const suggestedName = getWorkspaceFilename();

  // Preferred: system Save dialog (Chromium)
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName,
        types: [{
          description: "JSON",
          accept: { "application/json": [".json"] }
        }]
      });

      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();

      // Update filename to what user chose
      setWorkspaceFilename(handle.name);
      window.refreshWorkspaceFilenameUI?.();
      return;
    } catch (err) {
      if (err?.name === "AbortError") return; // user canceled
      console.error(err);
      alert("Save failed: " + err.message);
      return;
    }
  }

  // Fallback: normal download (can't know final name, so store suggested)
  setWorkspaceFilename(suggestedName);
  window.refreshWorkspaceFilenameUI?.();

  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = suggestedName;
  a.click();
  URL.revokeObjectURL(url);
}

// LOAD FROM FILE

function validateWorkspaceJSON(text) {
  let obj;
  try {
    obj = JSON.parse(text);
  } catch (e) {
    return { ok: false, error: "Invalid JSON (parse failed)." };
  }

  // Check for basic structural integrity
  if (typeof obj !== "object" || obj === null || Array.isArray(obj)) {
    return { ok: false, error: "Workspace JSON must be a JSON object (key/value map)." };
  }
  const keys = Object.keys(obj);
  if (keys.length === 0) {
    return { ok: false, error: "Workspace JSON is empty." };
  }
  if (keys.length > 5000) {
    return { ok: false, error: "Workspace JSON has too many keys; refusing to load." };
  }

  // localStorage values must be strings; we can coerce, but it's nice to check
  for (const k of keys) {
    const v = obj[k];
    if (typeof k !== "string") {
      return { ok: false, error: "Workspace JSON contains a non-string key." };
    }
    if (typeof v !== "string") {
      // Allow coercion, but fail if it's something huge/complex
      if (v && typeof v === "object") {
        return { ok: false, error: `Value for key "${k}" must be a string (found object/array).` };
      }
    }
  }

  return { ok: true, data: obj };
}

function restoreWorkspaceFromObject(dataObj) {
  // optional: clear first
  localStorage.clear();

  for (const [k, v] of Object.entries(dataObj)) {
    localStorage.setItem(k, String(v));
  }
}

async function loadWorkspace() {
  // Preferred: system Open dialog (Chromium)
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        multiple: false,
        types: [{
          description: "JSON",
          accept: { "application/json": [".json"] }
        }]
      });

      const file = await handle.getFile();
      const text = await file.text();
      const result = validateWorkspaceJSON(text);
      if (!result.ok) {
        alert("Load aborted: " + result.error);
        return;
      }
      restoreWorkspaceFromObject(result.data);

      // Override filename with loaded file name
      setWorkspaceFilename(file.name);

      location.reload();
      return;
    } catch (err) {
      if (err?.name === "AbortError") return; // user canceled
      console.error(err);
      alert("Load failed: " + err.message);
      return;
    }
  }

  // Fallback: use hidden <input type="file">
  document.getElementById("load-file").click();
}

document.getElementById("load-storage").addEventListener("click", loadWorkspace);

function makeImageInput(input, val, varname, vartitle) {
  input.src = val.src;
  input.width = "32";
  input.height = "32";
  input.id = "input-"+varname;
  if(val.label) input.alt = val.label;
  input.onerror = (e)=>{input.src = DEFAULT_TEXTURE; input.alt = "";};
  input.onclick = function() {
    const imgFileInput = document.getElementById("file-input-texture");
    document.getElementById("texture-h1").textContent = vartitle;
    document.getElementById("texture-p").textContent = input.alt ? input.alt : "";
    document.getElementById("texture-preview-img").src = input.src;
    document.getElementById("upload-texture").onclick = async () => {
      // Preferred: system Open dialog (Chromium)
      console.log("clicky");
      if (window.showOpenFilePicker) {
        try {
          const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: [{
              description: "Image file",
              accept: { "image/*": [".png", ".gif", ".jpeg", ".jpg", ".bmp"] }
            }]
          });
          const file = await handle.getFile();
          console.log("filteget");
          input.src = await convertImageToBase64(file)
          input.alt = file.name;
          input.dispatchEvent(new Event('input'));
          modal.style.display = "none";
        } catch (err) {
          if (err?.name === "AbortError") return; // user canceled
          logError(err);
        }
      }
      else imgFileInput.click();  // Fallback: use hidden <input type="file">
    }    
    imgFileInput.onchange = async () => {
      try {
        if (!imgFileInput.files?.length) return;
        const file = imgFileInput.files[0];
        input.src = await convertImageToBase64(file)
        input.alt = file.name;
        input.dispatchEvent(new Event('input'));
        modal.style.display = "none";
      } catch (err) {
        if (err?.name === "AbortError") return; // user canceled
        logError(err);
      }
    }
    document.getElementById("fetch-texture").onclick = () => {
      let newSrc = prompt("Enter the URL of an externally hosted texture to load:", "");
      if (newSrc != null){
        if(!newSrc.startsWith("http") && !newSrc.startsWith("data:")) newSrc = "https://" + newSrc;
        input.src = newSrc;
        input.alt = newSrc;
        input.dispatchEvent(new Event('input'));
        modal.style.display = "none";
      }
    }
    modal.style.display = "flex";
  }
}

function convertImageToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = (event) => {
      resolve(event.target.result); // Resolve the promise on successful load
    };

    reader.onerror = (error) => {
      reject(error); // Reject the promise if an error occurs
    };

    // Start the asynchronous read operation
    reader.readAsDataURL(file);
  });
}
